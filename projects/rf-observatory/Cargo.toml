[package]
name = "rf-observatory"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Wideband receiver references and verified FPGA channel-bank experiments"

[dependencies]
anyhow = "1"
bladerf-profile2-ipc = { path = "../../crates/bladerf-profile2-ipc" }
bladerf-profile2-recovery-ipc = { path = "../../crates/bladerf-profile2-recovery-ipc" }
bladerf-profile2-session-ipc = { path = "../../crates/bladerf-profile2-session-ipc" }
chrono = { default-features = false, features = ["clock", "std"], version = "0.4" }
clap = { features = ["derive"], version = "4.5" }
ctrlc = { features = ["termination"], version = "3.4" }
data-encoding = "2"
nix = { default-features = false, features = ["fs"], version = "0.31" }
ring = { version = "0.17", default-features = false }
rustfft = "6"
serde = { features = ["derive"], version = "1" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
