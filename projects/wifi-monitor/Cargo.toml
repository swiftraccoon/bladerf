[package]
name = "wifi-monitor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Passive bladeRF Wi-Fi capture and independent 802.11 frame inspection"

[features]
decode = ["dep:crafter", "dep:rustfft", "dep:rustix", "dep:sha2", "dep:tempfile"]
default = ["decode"]

[dependencies]
anyhow = "1"
bladerf-remote-id = { path = "../../crates/bladerf-remote-id" }
chrono = { default-features = false, features = ["clock", "std"], version = "0.4" }
clap = { features = ["derive"], version = "4.5" }
ctrlc = { features = ["termination"], version = "3.4" }
rustfft = { version = "6", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
serde = { features = ["derive"], version = "1" }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[dependencies.crafter]
default-features = false
features = ["radio"]
optional = true
path = "../../repos/libcrafter/crafter"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
