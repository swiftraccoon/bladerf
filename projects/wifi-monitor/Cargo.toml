[package]
name = "wifi-monitor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Passive bladeRF Wi-Fi capture and independent 802.11 frame inspection"

[features]
default = ["decode"]
decode = ["dep:crafter"]

[dependencies]
anyhow = "1"
chrono = { default-features = false, features = ["clock", "std"], version = "0.4" }
clap = { features = ["derive"], version = "4.5" }
ctrlc = { features = ["termination"], version = "3.4" }
crafter = { git = "https://github.com/pellegre/libcrafter", rev = "f9ef000bc402eebc676f6b4708395aa8ac169450", optional = true, default-features = false, features = ["radio"] }
serde = { features = ["derive"], version = "1" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
