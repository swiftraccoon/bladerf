[package]
name = "bladerf-profile2-adapter"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Isolated profile-2 adapter boundary for bladeRF RF-observatory"

[dependencies]
anyhow = "1"
bladerf-profile2-ipc = { path = "../../crates/bladerf-profile2-ipc" }
bladerf-profile2-loader-ipc = { path = "../../crates/bladerf-profile2-loader-ipc" }
bladerf-profile2-recovery-ipc = { path = "../../crates/bladerf-profile2-recovery-ipc" }
bladerf-profile2-session-ipc = { path = "../../crates/bladerf-profile2-session-ipc" }
clap = { features = ["derive"], version = "4.5" }
libloading = "0.8"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { default-features = false, features = ["fs"], version = "0.31" }
