[package]
name = "bladerf-lora-worker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Bounded file-only FutureSDR LoRa physical-layer decoder"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2"
futuresdr = { path = "../../repos/FutureSDR", default-features = false }
libc = "0.2"
lora = { path = "../../repos/FutureSDR/examples/lora", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
