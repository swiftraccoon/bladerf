[package]
name = "bladerf-docs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Offline validation and handbook rendering for source-qualified bladeRF facts"

[dependencies]
anyhow = "1"
clap = { features = ["derive"], version = "4.5" }
